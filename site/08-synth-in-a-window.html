<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A synth in a window · wclap-ts</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": {
    "wclap-ts": "/node_modules/wclap-ts/dist/index.js",
    "compost/": "/node_modules/compost/src/"
} }</script>
</head>
<body>
<main>
    <h1>A synth in a window</h1>
    <p class="lead">With <a href="https://github.com/charCulbert/compost">compost</a> components: the plug-in's own interface in a window you can drag around, a piano to play it (or your computer keyboard), and a meter and scope on what it plays.</p>
    <div class="demo">
    <div class="bar"><button id="start" class="primary">Start</button><button id="reopen" hidden>Open the synth's window</button></div>
    <compost-piano root-note="48" note-count="25" inline></compost-piano>
    <div class="levels">
    <compost-meter id="meter" label="Level" min="-60" max="6" curve="linear"></compost-meter>
    <compost-scope id="scope" value-range="2"></compost-scope>
    </div>
    <p class="status"></p>
    <compost-window id="window" heading="PICOH-101" x="560" y="140" width="640" height="360"><div id="ui"></div></compost-window>
    </div>
</main>
<script type="module" id="example">
import { isolate, loadWclap } from "wclap-ts";
import "compost/components/compost-window.js";
import "compost/components/compost-piano.js";
import "compost/components/compost-meter.js";
import "compost/components/compost-scope.js";

// Shared memory needs a cross-origin-isolated page. Where the server can't send the two headers, a service worker
// adds them (the page reloads once, the first time).
await isolate();
const status = document.querySelector(".status");
// Plug-ins load from any URL that allows it (CORS): these from GitHub, charCulbert/char-wclaps.
const WCLAPS = "https://raw.githubusercontent.com/charCulbert/char-wclaps/main/";

// Browsers start audio only after a click.
await new Promise((resolve) => (document.querySelector("#start").onclick = resolve));
const context = new AudioContext();
const win = document.querySelector("#window");
const synth = await loadWclap(context, WCLAPS + "PICOH-101.wclap.tar.gz");
synth.connect(context.destination);

// Its own interface in a compost window: a resizable interface lays itself out to the window's width (drag the
// window's corner to see), and the window takes the interface's height.
win.open = true;
win.setContentSize(820, 460);
const ui = document.querySelector("#ui");
await synth.showInterface(ui);
const fitHeight = () => win.setContentSize(win.contentSize.width, ui.offsetHeight);
new ResizeObserver(fitHeight).observe(ui);
const reopen = document.querySelector("#reopen");
win.addEventListener("window-close", () => (reopen.hidden = false));
reopen.onclick = () => {
    win.open = true;
    reopen.hidden = true;
};

// The piano plays it (and listens to the computer keyboard too).
const piano = document.querySelector("compost-piano");
piano.addEventListener("note-down", (e) => synth.noteOn(e.detail.note, 0.8));
piano.addEventListener("note-up", (e) => synth.noteOff(e.detail.note));

// What it plays, measured by ordinary Web Audio nodes.
const analyser = new AnalyserNode(context, { fftSize: 2048 });
synth.connect(analyser);
const samples = new Float32Array(analyser.fftSize);
const meter = document.querySelector("#meter");
const scope = document.querySelector("#scope");
const draw = () => {
    analyser.getFloatTimeDomainData(samples);
    let peak = 0;
    let sum = 0;
    for (const v of samples) {
        peak = Math.max(peak, Math.abs(v));
        sum += v * v;
    }
    const db = (x) => (x > 0 ? 20 * Math.log10(x) : -Infinity);
    meter.setState({ unit: "dB", channels: [{ primary: db(Math.sqrt(sum / samples.length)), peak: db(peak) }] });
    // Trigger on a rising edge: start the trace where the wave first crosses zero going up, so it stands still.
    let start = 1;
    while (start < samples.length / 2 && !(samples[start - 1] < 0 && samples[start] >= 0)) start++;
    scope.setSamples(samples.subarray(start, start + samples.length / 2));
    requestAnimationFrame(draw);
};
draw();
status.textContent = `${synth.descriptor.name} on ${synth.threads === "two" ? "two threads" : "one thread"} · play the piano`;
</script>
<script type="module" src="common.js"></script>
</body>
</html>
