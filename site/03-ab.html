<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A/B · wclap-ts</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "wclap-ts": "/node_modules/wclap-ts/dist/index.js", "compost/": "/node_modules/compost/src/" } }</script>
</head>
<body>
<main>
    <h1>A/B two plug-ins</h1>
    <p class="lead">Two synths get every note on the same audio frame; you switch which one you hear. Plug-in pages comparing two versions, or two settings, look like this. Space bar switches.</p>
    <div class="demo">
    <div class="bar">
    <button id="start" class="primary">Start</button>
    <button id="a">A</button>
    <button id="b">B</button>
    </div>
    <compost-piano root-note="48" note-count="25" inline></compost-piano>
    <p class="status"></p>
    </div>
</main>
<script type="module" id="example">
import "compost/components/compost-piano.js";
import { isolate, loadWclap } from "wclap-ts";

// Shared memory needs a cross-origin-isolated page. Where the server can't send the two headers, a service worker
// adds them (the page reloads once, the first time).
await isolate();
const status = document.querySelector(".status");
// Plug-ins load from any URL that allows it (CORS): these from GitHub, charCulbert/char-wclaps.
const WCLAPS = "https://raw.githubusercontent.com/charCulbert/char-wclaps/main/";

// Browsers start audio only after a click.
await new Promise((resolve) => (document.querySelector("#start").onclick = resolve));
const context = new AudioContext();
const a = await loadWclap(context, WCLAPS + "PICOH-101.wclap.tar.gz");
const b = await loadWclap(context, WCLAPS + "Pro54.wclap.tar.gz");

// Each plug-in is a Web Audio node: put a gain after each and crossfade.
const gainA = new GainNode(context, { gain: 1 });
const gainB = new GainNode(context, { gain: 0 });
a.connect(gainA).connect(context.destination);
b.connect(gainB).connect(context.destination);

let hearing = "A";
const hear = (side) => {
    hearing = side;
    const now = context.currentTime;
    gainA.gain.setTargetAtTime(side === "A" ? 1 : 0, now, 0.005);
    gainB.gain.setTargetAtTime(side === "B" ? 1 : 0, now, 0.005);
    status.textContent = `hearing ${side}: ${(side === "A" ? a : b).descriptor.name}`;
};
document.querySelector("#a").onclick = () => hear("A");
document.querySelector("#b").onclick = () => hear("B");
addEventListener("keydown", (e) => e.key === " " && hear(hearing === "A" ? "B" : "A"));

// The same AudioContext time on both: they land on the same frame.
const piano = document.querySelector("compost-piano"); // it plays from the computer keyboard too
piano.addEventListener("note-down", (e) => {
    const when = context.currentTime + 0.005;
    a.noteOn(e.detail.note, 0.8, when);
    b.noteOn(e.detail.note, 0.8, when);
});
piano.addEventListener("note-up", (e) => {
    const when = context.currentTime + 0.005;
    a.noteOff(e.detail.note, 0, when);
    b.noteOff(e.detail.note, 0, when);
});
hear("A");
</script>
<script type="module" src="common.js"></script>
</body>
</html>
